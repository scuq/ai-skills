# Semantic registry. This file is the single source of truth for interface meaning.
# Generate CSS tokens, enums, and internationalization keys from this file.
# A component reads a semantic name only, for example status: warning.
# A component never reads a raw color.

meta:
  app: example-app
  criticality: C2            # C1 critical | C2 operational | C3 informational
  owner: team-or-person
  version: 1

alert_levels:
  warning:
    meaning: Immediate operator action required.
    response: Act now; follow linked runbook.
    color: { token: sem-warning, light: "#B3261E", dark: "#F2B8B5" }
    icon: octagon-alert
    position: fixed-alert-bar
    persistence: while-active
    ack: required
    audio: warning-tone        # or: none
  caution:
    meaning: Action required within defined time.
    response: Investigate within 30 min.
    color: { token: sem-caution, light: "#8A5A00", dark: "#FFD27A" }
    icon: triangle-alert
    position: fixed-alert-bar
    persistence: while-active
    ack: required
    audio: none
  advisory:
    meaning: Awareness only.
    response: none required
    color: { token: sem-advisory, light: "#00658F", dark: "#8CCDFF" }
    icon: circle-info-outline
    position: inline
    persistence: auto-clear
    ack: optional
    audio: none
  normal:
    meaning: Within the expected range.
    response: none required
    color: { token: sem-normal, light: "#5F6368", dark: "#9AA0A6" }
    icon: none
    position: inline
    persistence: not-applicable
    ack: none
    audio: none
  unknown:
    meaning: State cannot be determined (no data, or the poll failed).
    response: Check data source.
    color: { token: sem-unknown, light: "#5F5F5F", dark: "#BDBDBD" }
    pattern: hatched
    icon: circle-question
    position: inline
    persistence: until-data-returns
    ack: none
    audio: none
  stale:
    meaning: The last value is older than the staleness threshold.
    response: Check data source. Do not trust the value.
    color: { token: sem-stale, light: "#5F5F5F", dark: "#BDBDBD" }
    pattern: dashed
    icon: clock-alert
    position: inline
    persistence: until-data-returns
    ack: none
    audio: none

severities:
  # A severity classifies a record. An alert asks a person to act.
  # Set alert_level only if each record of the severity has the response of that level.
  # color is the muted severity color for a severity without an alert level (rule 3j).
  # It has less saturation than the alert colors. A mapped severity uses the alert color instead.
  critical:
    { rank: 1, label: "Critical", short_label: "CRIT", alert_level: null,
      color: { token: sem-sev-critical, light: "#9E5A55", dark: "#D9A6A2" } }
  high:
    { rank: 2, label: "High", short_label: "HIGH", alert_level: null,
      color: { token: sem-sev-high, light: "#8F6236", dark: "#D6B48C" } }
  medium:
    { rank: 3, label: "Medium", short_label: "MED", alert_level: null,
      color: { token: sem-sev-medium, light: "#776D3A", dark: "#D0C78E" } }
  low:
    { rank: 4, label: "Low", short_label: "LOW", alert_level: null,
      color: { token: sem-sev-low, light: "#656A70", dark: "#A3A8AE" } }

states:
  # entity_type: { state: { meaning, alert_level, label, short_label } }
  # short_label is optional. Use it only in a compact layout.
  switch_port:
    up:         { meaning: Link up and forwarding., alert_level: normal,  label: "Up" }
    admin_down: { meaning: Disabled by operator.,   alert_level: advisory, label: "Admin down", short_label: "Adm down" }
    down:       { meaning: Enabled but no link.,    alert_level: caution, label: "Down" }
    err_disabled: { meaning: Disabled by device protection., alert_level: warning, label: "Err-disabled", short_label: "Err-dis" }
    unknown:    { meaning: Not polled or poll failed., alert_level: unknown, label: "Unknown" }
    stale:      { meaning: Last poll older than the threshold., alert_level: stale, label: "Stale" }

entity_fields:
  # Lower priority numbers show first in each layout.
  # A user cannot hide a field with required: true.
  switch_port:
    state:       { priority: 1, required: true }
    name:        { priority: 2, required: true }
    data_age:    { priority: 3, required: true }
    vlan:        { priority: 4, required: false }
    description: { priority: 5, required: false }

layouts:
  # Select a layout from the CSS width and the pointer type, not from the physical resolution.
  narrow: { max_css_px: 767, records: cards, navigation: bottom, detail: full-screen }
  medium: { min_css_px: 768, max_css_px: 1919, records: table, navigation: sidebar, detail: drawer }
  wide:   { min_css_px: 1920, records: table, navigation: sidebar, detail: side-by-side }
  pointer:
    # WCAG 2.2 SC 2.5.8 gives the fine minimum. The coarse value is a project choice.
    fine:   { min_target_css_px: 24 }
    coarse: { min_target_css_px: 44 }

staleness:
  # data source: max age before state becomes STALE
  snmp_poll: 5m
  inventory_sync: 24h

icons:
  # icon: meaning   (one meaning per icon, one icon per meaning)
  octagon-alert: warning level
  triangle-alert: caution level
  circle-info-outline: advisory level
  circle-question: unknown
  clock-alert: stale

labels:
  # canonical term: forbidden synonyms
  "Down": ["offline", "dead", "unreachable"]
  "Unknown": ["n/a", "-", "?"]
  "Stale": ["old", "outdated", "expired"]

deviations: []
  # - rule: 3a
  #   where: sparkline in overview tile
  #   reason: no room for a label, value shown as text in an adjacent tooltip that needs no hover
  #   approved_by: name
  #   date: 2026-09-20
