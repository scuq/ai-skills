# Test the Go modules and lint the documentation on each branch push.
name: ci

on:
  push:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Test the Go modules
        run: bash scripts/test.sh

      - name: Lint the documentation
        run: python3 skills/scuq-scraibe/reference/ste-lint.py README.md CLAUDE.md CHANGELOG.md docs/*.md
